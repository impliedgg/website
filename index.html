<!DOCTYPE html>
<html lang="en" />

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta charset="UTF-8" />

    <title>implied.win</title>
    <link rel="icon" type="image/png" href="/assets/avatar.png" /> <!-- favicon -->

    <!-- opengraph -->
    <meta property="og:title" content="implied.win - social links" />
    <meta property="og:site_name" content="implied.win" />
    <meta property="og:url" content="https://implied.win" />
    <meta property="og:type" content="website" />

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700;1000&display=swap');

        :root {
            /* --color-banner-accent: #ebade1; */
            --color-banner-accent: #af89a9;
            --color-background-dark-0: #0e0e0e;
            --color-background-dark-1: #1b1b1b;
            --color-foreground-dark-0: #efefef;
        }

        * {
            font-family: 'Lato', 'Arial', sans-serif;
            font-weight: 300;
            text-align: center;
        }

        body {
            background-color: var(--color-background-dark-0);
            color: var(--color-foreground-dark-0);
            margin: 0;
        }

        h1 {
            font-weight: 1000;
        }

        .banner {
            position: absolute;
            z-index: -1;
            width: 100%;
            height: 50%;
            top: 0;
            left: 0;
        }

        .banner svg {
            width: 100%;
            height: auto;
        }

        .banner svg path {
            fill: var(--color-banner-accent);
        }


        .header {
            display: grid;
            place-content: center;
            background-color: var(--color-background-dark-1);
            width: 80%;
            margin: 20% auto 0 auto;
        }

        @media (max-width: 900px) {
            .header {
                width: 100%;
                background-color: #00000000;
            }
        }

        .pfp {
            position: relative;
            top: -40%;
            object-fit: cover;
            border-radius: 50%;
            width: 50%;
            margin: 0 auto -10% auto;
        }

        .icons div {
            display: inline-block;
        }

        .icons a {
            display: inline-block;
            color: var(--color-foreground-dark-0);
            font-size: 4em;
            padding: 0.25em;
        }
    </style>

</head>

<body>
    <div class="banner" aria-hidden="true">
        <svg width="1920" height="540" viewBox="0 0 1920 540" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M1920 0H0V360V540H5.3404L1920 382.958V360V0Z" fill="#efefef" />
            <!-- inline fill as fallback, default to stylesheet -->
        </svg>
    </div>
    <div class="header">
        <img alt="" src="/assets/avatar.png" class="pfp" />
        <h1>emma</h1>
        <div aria-label="Social links" class="icons">
            <div> <!-- HACK for responsive layout to group icons into pairs -->
                <a aria-label="Discord link" target="_blank" href="https://discord.gg/C9BzEdFqX4">
                    <i class="bi bi-discord"></i>
                </a>
                <a aria-label="Telegram link" target="_blank" href="https://t.me/ovest04">
                    <i class="bi bi-telegram"></i>
                </a>
            </div>
            <div>
                <a aria-label="Twitter link" target="_blank" href="https://twitter.com/estrogenmommy">
                    <i class="bi bi-twitter"></i>
                </a>
                <a aria-label="Bluesky link" target="_blank" href="https://bsky.app/profile/implied.win">
                    <i class="bi bi-cloud-fill"></i>
                </a>
            </div>
        </div>
    </div>
    <link rel="stylesheet" href="/css/min-bi.css">

    <!-- mastodon verification. not used otherwise -->
    <a aria-hidden="true" style="display:none;" rel="me" href="https://tech.lgbt/@overestimate"></a>
</body>

</html>
