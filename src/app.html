<!doctype html>
<html lang="en">

<head>
	<meta charset="utf-8" />
	<link rel="icon" href="%sveltekit.assets%/avatar.png?v=4" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />

	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link
		href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&family=Outfit:wght@100..900&display=swap"
		rel="stylesheet">
	<style>
		* {
			font-family: "Outfit", sans-serif;

			--content: var(--color-text);
		}

		:root {
			height: 100%;
		}

		body {
			--margin-size: 0.5rem;
			background-color: var(--color-bg);
			color: var(--color-text);
			height: calc(100% - var(--margin-size));
			display: flex;
			flex-direction: column;
			margin: var(--margin-size);
		}
	</style>

	%sveltekit.head%
	<meta name="theme-color" content="#bb44bb">
</head>

<body data-sveltekit-preload-data="hover">
	<div style="display: contents">%sveltekit.body%</div>
</body>

</html>
