<!doctype html>
<html lang="en">

<head>
	<meta charset="utf-8" />
	<link rel="icon" href="%sveltekit.assets%/avatar.png" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />

	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link
		href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&family=Outfit:wght@100..900&display=swap"
		rel="stylesheet">
	<style>
		* {
			font-family: "Outfit", sans-serif;

			--layer-0: #121212;
			--layer-1: #2b2b2b;
			--layer-2: #313131;
			--layer-3: #4a4a4a;
			--layer-4: #606060;
			--layer-5: #797979;
			--layer-6: #8f8f8f;
			--layer-7: #a8a8a8;
			--layer-8: #bebebe;
			--layer-9: #c7c7c7;
			--layer-10: #dddddd;
			--layer-11: #e6e6e6;
			--layer-12: #fcfcfc;

			--content: var(--layer-12);
			--accent: #bb44bb;
		}

		body {
			background-color: var(--layer-0);
			color: var(--content);
		}

		a {
			color: var(--accent);
		}

		a:visited {
			color: (--accent);
		}
	</style>

	<!-- %sveltekit.head% - allows overrides -->
	%sveltekit.head%
	<!-- end %sveltekit.head%, begin defaults-->

	<title>emily's site</title>
	<meta name="theme-color" content="#bb44bb">
	<meta property="og:title" content="implied.win">
	<meta property="og:description" content="emily's personal website">
	<meta property="og:image" content="https://example.com/">
	<meta property="og:url" content="https://implied.win/">
	<meta property="og:type" content="website">
	<meta name="description">
</head>

<body data-sveltekit-preload-data="hover">
	<div style="display: contents">%sveltekit.body%</div>
</body>

</html>
